name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create App Environment
        run: |
          cordova create medapp com.sayan.medreminder "Medicine Reminder"
          rm -rf medapp/www/*
          cp index.html medapp/www/
          
      - name: Build Android App
        working-directory: ./medapp
        run: |
          cordova platform add android
          cordova build android

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Sayan-Medicine-App
          path: medapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
